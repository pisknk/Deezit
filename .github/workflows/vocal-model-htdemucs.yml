name: Build HT-Demucs model (experimental)

# Converts the vocals model of Demucs' htdemucs_ft (Meta, MIT) to Core ML for
# Deezit's on-device benchmark, and publishes it on the
# `vocal-model-htdemucs-v1` release. Runs when its converter changes, or by
# hand from the Actions tab.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/vocal_model/convert_htdemucs.py'
      - '.github/workflows/vocal-model-htdemucs.yml'

permissions:
  contents: write

jobs:
  model:
    runs-on: macos-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4" "torch==2.4.1" "torchaudio==2.4.1" "coremltools==8.1" "demucs==4.0.1"

      - name: convert
        shell: bash
        run: |
          set +e
          python tools/vocal_model/convert_htdemucs.py --out DeezitDemucs.mlpackage 2>&1 | tee convert.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # the end of the log as an annotation (readable without signing in)
            tail -n 40 convert.log | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'); print('::error title=convert failed::' + t)"
            exit "$status"
          fi

      - name: publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=vocal-model-htdemucs-v1
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "${{ github.sha }}" --title "Deezit HT-Demucs model (experimental)" \
              --notes "The vocals model of Demucs htdemucs_ft (Meta, MIT licence), split at the spectrogram and converted to Core ML for Deezit's on-device benchmark."
          fi
          gh release upload "$TAG" DeezitDemucs.mlpackage.aar DeezitDemucs.json --clobber

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeezitDemucs
          path: |
            DeezitDemucs.mlpackage.aar
            DeezitDemucs.json
          retention-days: 30
