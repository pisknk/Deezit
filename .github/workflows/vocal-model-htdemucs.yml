name: Build HT-Demucs model (experimental)

# Converts the vocals model of Demucs' htdemucs_ft (Meta, MIT) to Core ML for
# Deezit's on-device benchmark, and publishes it on the
# `vocal-model-htdemucs-v4` release. Runs when its converter changes, or by
# hand from the Actions tab.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/vocal_model/convert_htdemucs.py'
      - '.github/workflows/vocal-model-htdemucs.yml'

permissions:
  contents: write

jobs:
  model:
    runs-on: macos-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          # torch 2.4.0 is the newest coremltools 8.1 was tested with
          pip install "numpy==1.26.4" "torch==2.4.0" "torchaudio==2.4.0" "coremltools==8.1" "demucs==4.0.1"

      - name: convert
        shell: bash
        run: |
          set +e
          python tools/vocal_model/convert_htdemucs.py 2>&1 | tee convert.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # the end of the log, without progress bars, as annotations (readable without signing in)
            python3 - <<'PY'
          import re
          text = open("convert.log", errors="replace").read().replace("\r", "\n")
          lines = [l for l in text.split("\n") if l.strip() and "it/s]" not in l and "ops/s]" not in l and "B/s]" not in l
                   and "TracerWarning" not in l and "might lose precision" not in l]
          tail = "\n".join(lines[-45:])
          for i in range(0, len(tail), 3500):
              chunk = tail[i:i + 3500].replace("%", "%25").replace("\n", "%0A")
              print("::error title=convert failed (%d)::%s" % (i // 3500 + 1, chunk))
          PY
            exit "$status"
          fi

      - name: publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=vocal-model-htdemucs-v4
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "${{ github.sha }}" --title "Deezit HT-Demucs model (experimental)" \
              --notes "The vocals model of Demucs htdemucs_ft (Meta, MIT licence), split at the spectrogram and converted to Core ML for Deezit's on-device benchmark."
          fi
          gh release upload "$TAG" DeezitDemucs-*.mlpackage.aar DeezitDemucs.json --clobber

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeezitDemucs
          path: |
            DeezitDemucs-*.mlpackage.aar
            DeezitDemucs.json
          retention-days: 30
